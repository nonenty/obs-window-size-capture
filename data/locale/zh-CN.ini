Hint="按可执行文件名和宽高匹配，窗口标题仅供列表辨认，变化不会影响匹配。同一可执行文件的多个窗口请用不同尺寸区分。启用同进程子窗口采集时请选择主窗口：画布以主窗口为边界，同 PID 的窗口按相对位置叠加，超出部分裁剪。"
