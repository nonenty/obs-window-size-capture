name: Build and check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 unzip
      - name: Download OBS link library
        run: |
          curl --fail --location --retry 3 \
            https://github.com/obsproject/obs-studio/releases/download/32.0.4/OBS-Studio-32.0.4-Windows-x64.zip \
            --output "$RUNNER_TEMP/obs.zip"
          unzip -q "$RUNNER_TEMP/obs.zip" 'bin/64bit/obs.dll' -d "$RUNNER_TEMP/obs"
      - name: Check shell scripts
        run: bash -n build.sh test.sh package.sh
      - name: Build and package
        env:
          OBS_BIN: ${{ runner.temp }}/obs/bin/64bit
        run: |
          ./package.sh
          python3 tests/test_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            build/*-windows-x64.zip
            build/*-source.zip
          if-no-files-found: error
